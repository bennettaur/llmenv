services:
  # vibe-kanban:
  #   build: .
  #   ports:
  #     - "9001:9001"
  #   volumes:
  #     # Mount local repositories directory
  #     - ./repos:/workspace/repos
  #     # Mount MCP servers directory for tool access
  #     - ./mcp-servers:/workspace/mcp-servers
  #     # Mount Claude Code configuration (readonly)
  #     - ./claude-code/.claude:/home/llmuser/.claude:ro
  #     # Mount llmenv directory for configuration updates
  #     - .:/workspace/llmenv
  #   environment:
  #     - PORT=9001
  #     - NODE_ENV=production
  #     - LLMENV_ROOT=/workspace/llmenv
  #   depends_on:
  #     - litellm
  #   working_dir: /workspace/repos
  #   stdin_open: true
  #   tty: true
  #   restart: unless-stopped

  litellm:
    build:
      context: ./litellm
      args:
        target: runtime
    image: docker.litellm.ai/berriai/litellm:main-stable
    #########################################
    ## Uncomment these lines to start proxy with a config.yaml file ##
    volumes:
     - ./litellm/config.yaml:/app/config.yaml
    command:
     - "--config=/app/config.yaml"
    ##############################################
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql://${OM_PG_USER}:${OM_PG_PASSWORD}@postgres:5432/${LITELLM_DB_NAME}"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
      UI_USERNAME: "${UI_USERNAME}"
      UI_PASSWORD: "${UI_PASSWORD}"
    depends_on:
      - postgres  # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always

  # PostgreSQL Database for metadata and vector storage
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=${OM_PG_USER}
      - POSTGRES_PASSWORD=${OM_PG_PASSWORD}
      - POSTGRES_DB=${OM_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmemory -d openmemory']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openmemory:
    image: bennettaur/openmemory:latest
    deploy:
      resources:
        limits:
          memory: 2g
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OM_TELEMETRY=${OM_TELEMETRY:-false}
      # Core Configuration
      - OM_PORT=${OM_PORT:-8080}
      - OM_MODE=${OM_MODE:-standard}
      - OM_TIER=${OM_TIER:-hybrid}
      - OM_DB_PATH=${OM_DB_PATH:-/data/openmemory.sqlite}
      - OM_API_KEY=${OM_API_KEY:-}
      - OM_IDE_MODE=${OM_IDE_MODE:-false}
      - OM_IDE_ALLOWED_ORIGINS=${OM_IDE_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}

      # Rate Limiting
      - OM_RATE_LIMIT_ENABLED=${OM_RATE_LIMIT_ENABLED:-false}
      - OM_RATE_LIMIT_WINDOW_MS=${OM_RATE_LIMIT_WINDOW_MS:-60000}
      - OM_RATE_LIMIT_MAX_REQUESTS=${OM_RATE_LIMIT_MAX_REQUESTS:-100}

      # Compression
      - OM_COMPRESSION_ENABLED=${OM_COMPRESSION_ENABLED:-false}
      - OM_COMPRESSION_ALGORITHM=${OM_COMPRESSION_ALGORITHM:-auto}
      - OM_COMPRESSION_MIN_LENGTH=${OM_COMPRESSION_MIN_LENGTH:-100}

      # Embeddings Configuration
      - OM_EMBEDDINGS=${OM_EMBEDDINGS:-synthetic}
      - OM_EMBEDDING_FALLBACK=${OM_EMBEDDING_FALLBACK:-synthetic}
      - OM_EMBED_MODE=${OM_EMBED_MODE:-simple}
      - OM_ADV_EMBED_PARALLEL=${OM_ADV_EMBED_PARALLEL:-false}
      - OM_EMBED_DELAY_MS=${OM_EMBED_DELAY_MS:-200}
      - OM_VEC_DIM=${OM_VEC_DIM:-384}

      # OpenAI Provider
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OM_OPENAI_API_KEY=${OM_OPENAI_API_KEY:-}
      - OM_OPENAI_BASE_URL=${OM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OM_OPENAI_MODEL=${OM_OPENAI_MODEL:-}

      # Gemini Provider
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OM_GEMINI_API_KEY=${OM_GEMINI_API_KEY:-}

      # AWS Provider
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}

      # Ollama Provider
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OM_OLLAMA_URL=${OM_OLLAMA_URL:-http://localhost:11434}

      # Local Model
      - LOCAL_MODEL_PATH=${LOCAL_MODEL_PATH:-}
      - OM_LOCAL_MODEL_PATH=${OM_LOCAL_MODEL_PATH:-}

      # Memory & Search
      - OM_MIN_SCORE=${OM_MIN_SCORE:-0.3}
      - OM_MAX_PAYLOAD_SIZE=${OM_MAX_PAYLOAD_SIZE:-1000000}

      # LangGraph Configuration
      - OM_LG_NAMESPACE=${OM_LG_NAMESPACE:-default}
      - OM_LG_MAX_CONTEXT=${OM_LG_MAX_CONTEXT:-50}
      - OM_LG_REFLECTIVE=${OM_LG_REFLECTIVE:-true}

      # Metadata Backend (PostgreSQL)
      - OM_METADATA_BACKEND=${OM_METADATA_BACKEND:-postgres}
      - OM_PG_HOST=${OM_PG_HOST:-postgres}
      - OM_PG_PORT=${OM_PG_PORT:-5432}
      - OM_PG_DB=${OM_PG_DB:-openmemory}
      - OM_PG_USER=${OM_PG_USER:-openmemory}
      - OM_PG_PASSWORD=${OM_PG_PASSWORD:-openmemory}
      - OM_PG_SCHEMA=${OM_PG_SCHEMA:-public}
      - OM_PG_TABLE=${OM_PG_TABLE:-openmemory_memories}
      - OM_PG_SSL=${OM_PG_SSL:-disable}

      # Vector Backend (PostgreSQL with pgvector)
      - OM_VECTOR_BACKEND=${OM_VECTOR_BACKEND:-postgres}
      - OM_VECTOR_TABLE=${OM_VECTOR_TABLE:-openmemory_vectors}
      - OM_WEAVIATE_URL=${OM_WEAVIATE_URL:-}
      - OM_WEAVIATE_API_KEY=${OM_WEAVIATE_API_KEY:-}
      - OM_WEAVIATE_CLASS=${OM_WEAVIATE_CLASS:-OpenMemory}

      # Auto Reflection
      - OM_AUTO_REFLECT=${OM_AUTO_REFLECT:-false}
      - OM_REFLECT_INTERVAL=${OM_REFLECT_INTERVAL:-10}
      - OM_REFLECT_MIN_MEMORIES=${OM_REFLECT_MIN_MEMORIES:-20}

      # User Summaries
      - OM_USER_SUMMARY_INTERVAL=${OM_USER_SUMMARY_INTERVAL:-30}
      - OM_USE_SUMMARY_ONLY=${OM_USE_SUMMARY_ONLY:-true}
      - OM_SUMMARY_MAX_LENGTH=${OM_SUMMARY_MAX_LENGTH:-200}

      # HSG Configuration
      - OM_SEG_SIZE=${OM_SEG_SIZE:-10000}
      - OM_CACHE_SEGMENTS=${OM_CACHE_SEGMENTS:-3}
      - OM_MAX_ACTIVE=${OM_MAX_ACTIVE:-64}

      # Decay System
      - OM_DECAY_LAMBDA=${OM_DECAY_LAMBDA:-0.02}
      - OM_DECAY_INTERVAL_MINUTES=${OM_DECAY_INTERVAL_MINUTES:-1440}
      - OM_DECAY_RATIO=${OM_DECAY_RATIO:-0.03}
      - OM_DECAY_SLEEP_MS=${OM_DECAY_SLEEP_MS:-200}
      - OM_DECAY_THREADS=${OM_DECAY_THREADS:-3}
      - OM_DECAY_COLD_THRESHOLD=${OM_DECAY_COLD_THRESHOLD:-0.25}
      - OM_DECAY_REINFORCE_ON_QUERY=${OM_DECAY_REINFORCE_ON_QUERY:-true}

      # Compression & Regeneration
      - OM_REGENERATION_ENABLED=${OM_REGENERATION_ENABLED:-true}
      - OM_MAX_VECTOR_DIM=${OM_MAX_VECTOR_DIM:-256}
      - OM_MIN_VECTOR_DIM=${OM_MIN_VECTOR_DIM:-64}
      - OM_SUMMARY_LAYERS=${OM_SUMMARY_LAYERS:-3}

      # Keyword Extraction
      - OM_KEYWORD_BOOST=${OM_KEYWORD_BOOST:-2.5}
      - OM_KEYWORD_MIN_LENGTH=${OM_KEYWORD_MIN_LENGTH:-3}
    volumes:
      - openmemory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard: Web UI for visualizing and managing memories
  dashboard:
    image: bennettaur/openmemory-dashboard:latest
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
    depends_on:
      openmemory:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Valkey for high-performance vector storage
  # Uncomment to use Valkey instead of SQLite/PostgreSQL for vectors
  # Don't forget to set OM_VECTOR_BACKEND=valkey in your .env
  # valkey:
  #   image: valkey/valkey:8.0
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - valkey_data:/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ['CMD', 'valkey-cli', 'ping']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

volumes:
  openmemory_data:
    driver: local
  # Uncomment if using Valkey
  # valkey_data:
  #   driver: local
  prometheus_data:
    driver: local
  postgres_data:
    driver: local
    name: litellm_postgres_data # Named volume for Postgres data persistence
