[project]
name = "code-review-interview"
version = "0.1.0"
description = "Phased interview that captures how you review code, then writes a Code Review Style doc for other LLMs to follow."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7",
]

[project.scripts]
code-review-interview = "code_review_interview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_review_interview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The smoke_* scripts call the live API; keep them out of a default run.
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
